# Generated by tmux.app Config Generator
# https://tmux.app/#config-generator

# ── Prefix Key ───────────────────────────
unbind C-b
set -g prefix M-x
bind M-x send-prefix

# ── General Settings ─────────────────────
setw -g mode-keys vi
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on

# ── Terminal Colors ──────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ',xterm-256color*:RGB'

# Claude Code native binary bernama versi (mis. 2.1.302); tampilkan sebagai "claude"
set -g automatic-rename-format '#{?#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}'

# ── Custom Keybindings ───────────────────
# Replace arrows with hjkl
unbind Left
unbind Down
unbind Up
unbind Right
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Keep cwd when split and create new window
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── TPM Plugin Manager ───────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ── Continuum's Config ───────────────────
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5' # in minutes

# ── Resurrect's Config ───────────────────
# set -g @resurrect-strategy-nvim 'sessions'

# ── Catppuccin Config ───────────────────
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_number_position 'left'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'
set -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_date_time_text " %d/%m/%Y %H:%M"
set -g @catppuccin_cpu_text "  #{l:#{cpu_percentage}}"
set -g @catppuccin_ram_text "  #{l:#(~/.tmux/scripts/ram_gb.sh)}"

# ── Status Bar ───────────────────────────
set -g status-position bottom
set -g status-interval 15
set -g status-right-length 200
set -g status-left-length 100
set -g status-left '#{E:@catppuccin_status_session}'
set -g status-right '#{E:@catppuccin_status_application}'
set -agF status-right '#{E:@catppuccin_status_cpu}'
set -agF status-right '#{E:@catppuccin_status_ram}'
set -agF status-right '#{E:@catppuccin_status_uptime}'
set -agF status-right '#{E:@catppuccin_status_date_time}'

# ⚠️ Keep this line at the very bottom of .tmux.conf
run '~/.tmux/plugins/tpm/tpm'
